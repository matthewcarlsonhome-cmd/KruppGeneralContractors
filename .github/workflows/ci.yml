name: KruppAI CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]" fastapi uvicorn[standard]

      - name: Lint with ruff
        run: ruff check kruppai/ tests/

      - name: Type check with mypy
        run: mypy kruppai/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v -m "not integration" --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kruppai:latest .

      - name: Verify container starts
        run: |
          docker run -d --name kruppai-test -p 8000:8000 \
            -e ANTHROPIC_API_KEY=sk-ant-test-placeholder \
            kruppai:latest
          sleep 5
          curl -f http://localhost:8000/api/v1/health || exit 1
          docker stop kruppai-test
